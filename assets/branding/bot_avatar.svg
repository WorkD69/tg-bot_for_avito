<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2D5499"/>
      <stop offset="100%" stop-color="#0F2040"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>

  <!-- Subtle inner ring for depth -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.08"/>

  <!-- Letter S — main brand mark -->
  <text
    x="256"
    y="330"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="280"
    font-weight="900"
    text-anchor="middle"
    fill="#FFFFFF"
    letter-spacing="-8"
  >S</text>

  <!-- Accent dot — orange, upper right of S -->
  <circle cx="358" cy="148" r="32" fill="#FF6B35"/>

  <!-- Small white highlight inside accent dot -->
  <circle cx="348" cy="138" r="10" fill="#FFFFFF" opacity="0.4"/>
</svg>
