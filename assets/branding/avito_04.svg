<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg04" cx="60%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#2D5499"/>
      <stop offset="100%" stop-color="#0F2040"/>
    </radialGradient>
    <filter id="glowCard">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#FF6B35" flood-opacity="0.2"/>
    </filter>
    <filter id="whiteCard">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg04)"/>

  <!-- Decorative elements -->
  <circle cx="200" cy="100" r="300" fill="#FFFFFF" opacity="0.03"/>
  <circle cx="1100" cy="700" r="250" fill="#FF6B35" opacity="0.06"/>

  <!-- Left: headline -->
  <rect x="60" y="80" width="8" height="140" rx="4" fill="#FF6B35"/>

  <text x="100" y="160"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="58"
    font-weight="900"
    fill="#FFFFFF">Почему</text>

  <text x="100" y="230"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="58"
    font-weight="900"
    fill="#FF6B35">нам доверяют?</text>

  <!-- Trust cards -->

  <!-- Card: Live operators -->
  <rect x="60" y="290" width="500" height="120" rx="16" fill="#FFFFFF" opacity="0.1"/>
  <rect x="60" y="290" width="5" height="120" rx="2.5" fill="#FF6B35"/>
  <text x="100" y="348" font-family="Arial, Helvetica, sans-serif" font-size="42">👨‍💻</text>
  <text x="165" y="343"
    font-family="Arial Black, Arial, sans-serif"
    font-size="24"
    font-weight="900"
    fill="#FFFFFF">Живые операторы</text>
  <text x="165" y="375"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    fill="#B8CCE8">Не боты — реальные специалисты</text>
  <text x="165" y="400"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    fill="#B8CCE8">с профильным образованием</text>

  <!-- Card: Transparent pricing -->
  <rect x="60" y="430" width="500" height="120" rx="16" fill="#FFFFFF" opacity="0.1"/>
  <rect x="60" y="430" width="5" height="120" rx="2.5" fill="#27AE60"/>
  <text x="100" y="488" font-family="Arial, Helvetica, sans-serif" font-size="42">💰</text>
  <text x="165" y="483"
    font-family="Arial Black, Arial, sans-serif"
    font-size="24"
    font-weight="900"
    fill="#FFFFFF">Честная цена</text>
  <text x="165" y="515"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    fill="#B8CCE8">Аукцион среди операторов —</text>
  <text x="165" y="540"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    fill="#B8CCE8">получаете минимальную ставку</text>

  <!-- Card: Telegram communication -->
  <rect x="60" y="570" width="500" height="120" rx="16" fill="#FFFFFF" opacity="0.1"/>
  <rect x="60" y="570" width="5" height="120" rx="2.5" fill="#2AABEE"/>
  <text x="100" y="628" font-family="Arial, Helvetica, sans-serif" font-size="42">💬</text>
  <text x="165" y="623"
    font-family="Arial Black, Arial, sans-serif"
    font-size="24"
    font-weight="900"
    fill="#FFFFFF">Всё в Telegram</text>
  <text x="165" y="655"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    fill="#B8CCE8">Никаких регистраций, email,</text>
  <text x="165" y="680"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    fill="#B8CCE8">звонков и лишних шагов</text>

  <!-- Right side: main promise card -->
  <rect x="620" y="280" width="520" height="400" rx="24" fill="#FFFFFF" filter="url(#glowCard)"/>

  <!-- Orange accent top -->
  <rect x="620" y="280" width="520" height="8" rx="4" fill="#FF6B35"/>

  <text x="880" y="360"
    font-family="Arial, Helvetica, sans-serif"
    font-size="56">🛡️</text>

  <text x="880" y="430"
    font-family="Arial Black, Arial, sans-serif"
    font-size="32"
    font-weight="900"
    text-anchor="middle"
    fill="#1A1A2E">Спор бесплатно</text>

  <text x="880" y="490"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    text-anchor="middle"
    fill="#6B7A99">Если результат не устраивает —</text>

  <text x="880" y="520"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    text-anchor="middle"
    fill="#6B7A99">открывайте спор прямо в боте</text>

  <rect x="660" y="560" width="440" height="2" rx="1" fill="#E8F0FE"/>

  <text x="880" y="610"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    text-anchor="middle"
    fill="#6B7A99">Поддержка 7 дней в неделю</text>

  <rect x="680" y="640" width="400" height="52" rx="26" fill="#1B3A6B"/>
  <text x="880" y="672"
    font-family="Arial Black, Arial, sans-serif"
    font-size="20"
    font-weight="900"
    text-anchor="middle"
    fill="#FFFFFF">@studario_support</text>

  <!-- Brand name -->
  <text x="1140" y="775"
    font-family="Arial Black, Arial, sans-serif"
    font-size="22"
    font-weight="900"
    text-anchor="end"
    fill="#FFFFFF"
    opacity="0.5">Studario</text>
</svg>
