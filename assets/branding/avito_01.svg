<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="bg01" cx="30%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#2D5499"/>
      <stop offset="100%" stop-color="#0F2040"/>
    </radialGradient>
    <filter id="shadow01">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg01)"/>

  <!-- Decorative circles -->
  <circle cx="980" cy="120" r="240" fill="#FFFFFF" opacity="0.04"/>
  <circle cx="1050" cy="700" r="180" fill="#FF6B35" opacity="0.08"/>
  <circle cx="100" cy="650" r="160" fill="#FFFFFF" opacity="0.03"/>

  <!-- Orange accent bar top -->
  <rect x="80" y="80" width="6" height="120" rx="3" fill="#FF6B35"/>

  <!-- Main headline -->
  <text x="120" y="190"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="76"
    font-weight="900"
    fill="#FFFFFF"
    letter-spacing="-2">Решим задачу</text>

  <text x="120" y="290"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="76"
    font-weight="900"
    fill="#FF6B35"
    letter-spacing="-2">за вас</text>

  <!-- Subheadline -->
  <text x="120" y="380"
    font-family="Arial, Helvetica, sans-serif"
    font-size="34"
    font-weight="400"
    fill="#B8CCE8">Математика · Физика · Программирование</text>

  <text x="120" y="430"
    font-family="Arial, Helvetica, sans-serif"
    font-size="34"
    font-weight="400"
    fill="#B8CCE8">Экономика · Химия · Статистика</text>

  <!-- Divider line -->
  <rect x="120" y="470" width="500" height="2" rx="1" fill="#FFFFFF" opacity="0.15"/>

  <!-- Value props -->
  <text x="120" y="530"
    font-family="Arial, Helvetica, sans-serif"
    font-size="28"
    font-weight="600"
    fill="#FFFFFF">✓  Аукцион цен — платите меньше</text>

  <text x="120" y="580"
    font-family="Arial, Helvetica, sans-serif"
    font-size="28"
    font-weight="600"
    fill="#FFFFFF">✓  Решение в Telegram — никаких звонков</text>

  <text x="120" y="630"
    font-family="Arial, Helvetica, sans-serif"
    font-size="28"
    font-weight="600"
    fill="#FFFFFF">✓  Не устраивает — оспорьте бесплатно</text>

  <!-- CTA pill -->
  <rect x="120" y="670" width="340" height="72" rx="36" fill="#FF6B35" filter="url(#shadow01)"/>
  <text x="290" y="716"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="26"
    font-weight="900"
    text-anchor="middle"
    fill="#FFFFFF">Написать в Telegram →</text>

  <!-- Logo area (right side) -->
  <!-- Background S mark -->
  <text x="880" y="480"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="420"
    font-weight="900"
    text-anchor="middle"
    fill="#FFFFFF"
    opacity="0.05">S</text>

  <!-- Brand name bottom right -->
  <text x="1140" y="760"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="28"
    font-weight="900"
    text-anchor="end"
    fill="#FFFFFF"
    opacity="0.6">Studario</text>
  <circle cx="1100" cy="750" r="8" fill="#FF6B35" opacity="0.7"/>
</svg>
