  <text x="60" y="155"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="50"
    font-weight="900"
    fill="#FFFFFF">Программирование</text>

  <rect x="720" y="50" width="300" height="44" rx="22" fill="#FF6B35"/>
  <text x="870" y="78"
    font-family="Arial Black, Arial, sans-serif"
    font-size="20"
    font-weight="900"
    text-anchor="middle"
    fill="#FFFFFF">💻 Python / SQL</text>

  <!-- Task description -->
  <rect x="40" y="230" width="1000" height="210" rx="20" fill="#FFFFFF" filter="url(#cs2shadow)"/>
  <rect x="40" y="230" width="6" height="210" rx="3" fill="#FF6B35"/>

  <text x="80" y="278"
    font-family="Arial Black, Arial, sans-serif"
    font-size="24"
    font-weight="900"
    fill="#1A1A2E">Задача клиента</text>

  <text x="80" y="318"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    fill="#1A1A2E">Написать скрипт парсинга данных с веб-сайта,</text>
  <text x="80" y="350"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    fill="#1A1A2E">сохранить результат в БД PostgreSQL,</text>
  <text x="80" y="382"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    fill="#1A1A2E">написать SQL-запросы для аналитики</text>
  <text x="80" y="420"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    fill="#6B7A99">Срок: 1 день · Дедлайн: сдача курсовой</text>

  <!-- Stats row -->
  <rect x="40" y="470" width="312" height="140" rx="20" fill="#FFFFFF" filter="url(#cs2shadow)"/>
  <text x="196" y="530"
    font-family="Arial Black, Arial, sans-serif"
    font-size="22"
    font-weight="900"
    text-anchor="middle"
    fill="#6B7A99">СЛОЖНОСТЬ</text>
  <text x="196" y="578"
    font-family="Arial Black, Arial, sans-serif"
    font-size="36"
    font-weight="900"
    text-anchor="middle"
    fill="#1A1A2E">Высокая</text>

  <rect x="368" y="470" width="312" height="140" rx="20" fill="#FFFFFF" filter="url(#cs2shadow)"/>
  <text x="524" y="530"
    font-family="Arial Black, Arial, sans-serif"
    font-size="22"
    font-weight="900"
    text-anchor="middle"
    fill="#6B7A99">ВЫПОЛНЕНО ЗА</text>
  <text x="524" y="578"
    font-family="Arial Black, Arial, sans-serif"
    font-size="36"
    font-weight="900"
    text-anchor="middle"
    fill="#1A1A2E">~6 часов</text>

  <rect x="696" y="470" width="344" height="140" rx="20" fill="#FF6B35" filter="url(#cs2shadow)"/>
  <text x="868" y="530"
    font-family="Arial Black, Arial, sans-serif"
    font-size="22"
    font-weight="900"
    text-anchor="middle"
    fill="rgba(255,255,255,0.8)">ОЦЕНКА</text>
  <text x="868" y="578"
    font-family="Arial Black, Arial, sans-serif"
    font-size="36"
    font-weight="900"
    text-anchor="middle"
    fill="#FFFFFF">⭐⭐⭐⭐⭐</text>

  <!-- What was done -->
  <rect x="40" y="640" width="1000" height="230" rx="20" fill="#1B3A6B"/>

  <text x="80" y="694"
    font-family="Arial Black, Arial, sans-serif"
