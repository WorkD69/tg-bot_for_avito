  <text x="80" y="774"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    fill="#FFFFFF">✓  Схема БД + импорт 500+ записей</text>
  <text x="80" y="810"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    fill="#FFFFFF">✓  5 SQL-запросов с пояснениями</text>
  <text x="80" y="846"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    fill="#B8CCE8">✓  Код принят, курсовая защищена на отлично</text>

  <!-- Footer -->
  <rect x="0" y="908" width="1080" height="172" fill="#F0F4FF"/>
  <rect x="0" y="908" width="1080" height="3" fill="#E8F0FE"/>

  <text x="60" y="966"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    fill="#6B7A99">Персональные данные скрыты · Задача обобщена</text>

  <text x="60" y="1012"
    font-family="Arial Black, Arial, sans-serif"
    font-size="30"
    font-weight="900"
    fill="#1B3A6B">Studario</text>

  <text x="60" y="1052"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    fill="#6B7A99">Telegram-бот для учебных задач</text>

  <circle cx="980" cy="968" r="56" fill="#1B3A6B" opacity="0.1"/>
  <text x="980" y="984"
    font-family="Arial Black, Arial, sans-serif"
    font-size="44"
    font-weight="900"
    text-anchor="middle"
    fill="#1B3A6B">S</text>
</svg>
