<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <filter id="cs2shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#1B3A6B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="#F8FAFF"/>
  <rect x="0" y="0" width="1080" height="10" fill="#FF6B35"/>

  <!-- Header — orange accent this time for variety -->
  <rect x="0" y="10" width="1080" height="180" fill="#1B3A6B"/>

  <text x="60" y="85"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    fill="#B8CCE8"
