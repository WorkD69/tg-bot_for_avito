<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <filter id="cs3shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#1B3A6B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="#F8FAFF"/>
  <rect x="0" y="0" width="1080" height="10" fill="#27AE60"/>

  <!-- Header -->
  <rect x="0" y="10" width="1080" height="180" fill="#1B3A6B"/>

  <text x="60" y="85"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    fill="#B8CCE8"
    letter-spacing="3">КЕЙС STUDARIO</text>

  <text x="60" y="155"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="50"
    font-weight="900"
    fill="#FFFFFF">Физика</text>

  <rect x="820" y="50" width="200" height="44" rx="22" fill="#27AE60"/>
  <text x="920" y="78"
    font-family="Arial Black, Arial, sans-serif"
    font-size="20"
    font-weight="900"
    text-anchor="middle"
    fill="#FFFFFF">⚡ Электричество</text>

  <!-- Task description -->
  <rect x="40" y="230" width="1000" height="200" rx="20" fill="#FFFFFF" filter="url(#cs3shadow)"/>
  <rect x="40" y="230" width="6" height="200" rx="3" fill="#27AE60"/>

  <text x="80" y="278"
    font-family="Arial Black, Arial, sans-serif"
    font-size="24"
    font-weight="900"
    fill="#1A1A2E">Задача клиента</text>

  <text x="80" y="318"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    fill="#1A1A2E">Задачник по электрическим цепям: 8 задач.</text>
  <text x="80" y="350"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    fill="#1A1A2E">Расчёт тока, напряжения, мощности.</text>
  <text x="80" y="382"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    fill="#1A1A2E">Законы Кирхгофа, Ома — с объяснениями</text>
  <text x="80" y="412"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    fill="#6B7A99">Дедлайн: следующий день</text>

  <!-- Stats -->
  <rect x="40" y="458" width="312" height="130" rx="20" fill="#FFFFFF" filter="url(#cs3shadow)"/>
  <text x="196" y="512"
    font-family="Arial Black, Arial, sans-serif"
    font-size="22"
    font-weight="900"
    text-anchor="middle"
    fill="#6B7A99">ЗАДАЧ</text>
  <text x="196" y="564"
    font-family="Arial Black, Arial, sans-serif"
    font-size="50"
    font-weight="900"
    text-anchor="middle"
    fill="#1A1A2E">8</text>

  <rect x="368" y="458" width="312" height="130" rx="20" fill="#FFFFFF" filter="url(#cs3shadow)"/>
  <text x="524" y="512"
    font-family="Arial Black, Arial, sans-serif"
    font-size="22"
    font-weight="900"
    text-anchor="middle"
    fill="#6B7A99">СРОК</text>
  <text x="524" y="558"
    font-family="Arial Black, Arial, sans-serif"
    font-size="36"
    font-weight="900"
    text-anchor="middle"
    fill="#1A1A2E">~4 часа</text>

  <rect x="696" y="458" width="344" height="130" rx="20" fill="#27AE60"/>
  <text x="868" y="512"
    font-family="Arial Black, Arial, sans-serif"
    font-size="22"
    font-weight="900"
    text-anchor="middle"
    fill="rgba(255,255,255,0.8)">РЕЗУЛЬТАТ</text>
  <text x="868" y="558"
    font-family="Arial Black, Arial, sans-serif"
    font-size="28"
    font-weight="900"
    text-anchor="middle"
    fill="#FFFFFF">Принято ✓</text>

  <!-- Timeline block -->
  <rect x="40" y="618" width="1000" height="260" rx="20" fill="#FFFFFF" filter="url(#cs3shadow)"/>

  <text x="80" y="665"
    font-family="Arial Black, Arial, sans-serif"
    font-size="24"
    font-weight="900"
    fill="#1A1A2E">Как проходила работа</text>

  <!-- Timeline items -->
  <circle cx="80" cy="716" r="10" fill="#1B3A6B"/>
  <rect x="90" y="714" width="40" height="4" rx="2" fill="#E8F0FE"/>
  <text x="142" y="722"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    fill="#6B7A99">10:30</text>
  <text x="220" y="722"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    fill="#1A1A2E">— Клиент отправил фото из задачника</text>

  <circle cx="80" cy="766" r="10" fill="#FF6B35"/>
  <rect x="90" y="764" width="40" height="4" rx="2" fill="#E8F0FE"/>
  <text x="142" y="772"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    fill="#6B7A99">10:50</text>
  <text x="220" y="772"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    fill="#1A1A2E">— Оператор принял заявку, назначена цена</text>

  <circle cx="80" cy="816" r="10" fill="#FF6B35"/>
  <rect x="90" y="814" width="40" height="4" rx="2" fill="#E8F0FE"/>
  <text x="142" y="822"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    fill="#6B7A99">14:45</text>
  <text x="220" y="822"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    fill="#1A1A2E">— Решение загружено: PDF с расчётами</text>

  <circle cx="80" cy="854" r="10" fill="#27AE60"/>
  <text x="142" y="860"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    fill="#6B7A99">На следующий день</text>
  <text x="340" y="860"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    fill="#27AE60">— Преподаватель поставил зачёт ✓</text>

  <!-- Footer -->
  <rect x="0" y="918" width="1080" height="162" fill="#F0F4FF"/>
  <rect x="0" y="918" width="1080" height="3" fill="#E8F0FE"/>

  <text x="60" y="972"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    fill="#6B7A99">Данные клиента скрыты · Задача обобщена для публикации</text>

  <text x="60" y="1018"
    font-family="Arial Black, Arial, sans-serif"
    font-size="30"
    font-weight="900"
    fill="#1B3A6B">Studario</text>

  <text x="60" y="1058"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    fill="#6B7A99">Telegram-бот для учебных задач</text>

  <circle cx="990" cy="978" r="50" fill="#27AE60" opacity="0.12"/>
  <text x="990" y="994"
    font-family="Arial Black, Arial, sans-serif"
    font-size="44"
    font-weight="900"
    text-anchor="middle"
    fill="#27AE60">S</text>
</svg>
