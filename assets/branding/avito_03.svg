<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <filter id="stepShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#1B3A6B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#F8FAFF"/>
  <rect x="0" y="0" width="1200" height="8" fill="#FF6B35"/>

  <!-- Header -->
  <rect x="0" y="8" width="1200" height="150" fill="#1B3A6B"/>

  <text x="600" y="75"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="44"
    font-weight="900"
    text-anchor="middle"
    fill="#FFFFFF">Как это работает?</text>

  <text x="600" y="125"
    font-family="Arial, Helvetica, sans-serif"
    font-size="26"
    text-anchor="middle"
    fill="#B8CCE8">4 шага от заявки до готового решения</text>

  <!-- Connector line between steps -->
  <rect x="218" y="330" width="764" height="4" rx="2" fill="#E8F0FE"/>

  <!-- Step 1 -->
  <circle cx="218" cy="332" r="52" fill="#1B3A6B" filter="url(#stepShadow)"/>
  <text x="218" y="345"
    font-family="Arial Black, Arial, sans-serif"
    font-size="40"
    font-weight="900"
    text-anchor="middle"
    fill="#FFFFFF">1</text>

  <text x="218" y="430"
    font-family="Arial Black, Arial, sans-serif"
    font-size="22"
    font-weight="900"
    text-anchor="middle"
    fill="#1A1A2E">Отправляете</text>
  <text x="218" y="458"
    font-family="Arial Black, Arial, sans-serif"
    font-size="22"
    font-weight="900"
    text-anchor="middle"
    fill="#1A1A2E">задание</text>
  <text x="218" y="500"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    text-anchor="middle"
    fill="#6B7A99">Файлы, фото, текст —</text>
  <text x="218" y="524"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    text-anchor="middle"
    fill="#6B7A99">как вам удобно</text>

  <!-- Step 2 -->
  <circle cx="472" cy="332" r="52" fill="#FF6B35" filter="url(#stepShadow)"/>
  <text x="472" y="345"
    font-family="Arial Black, Arial, sans-serif"
    font-size="40"
    font-weight="900"
    text-anchor="middle"
    fill="#FFFFFF">2</text>

  <text x="472" y="430"
    font-family="Arial Black, Arial, sans-serif"
    font-size="22"
    font-weight="900"
    text-anchor="middle"
    fill="#1A1A2E">Получаете</text>
  <text x="472" y="458"
    font-family="Arial Black, Arial, sans-serif"
    font-size="22"
    font-weight="900"
    text-anchor="middle"
    fill="#1A1A2E">лучшую цену</text>
  <text x="472" y="500"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    text-anchor="middle"
    fill="#6B7A99">Операторы делают</text>
  <text x="472" y="524"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    text-anchor="middle"
    fill="#6B7A99">ставки — вы выбираете</text>

  <!-- Step 3 -->
  <circle cx="728" cy="332" r="52" fill="#1B3A6B" filter="url(#stepShadow)"/>
  <text x="728" y="345"
    font-family="Arial Black, Arial, sans-serif"
    font-size="40"
    font-weight="900"
    text-anchor="middle"
    fill="#FFFFFF">3</text>

  <text x="728" y="430"
    font-family="Arial Black, Arial, sans-serif"
    font-size="22"
    font-weight="900"
    text-anchor="middle"
    fill="#1A1A2E">Оплачиваете</text>
  <text x="728" y="458"
    font-family="Arial Black, Arial, sans-serif"
    font-size="22"
    font-weight="900"
    text-anchor="middle"
    fill="#1A1A2E">онлайн</text>
  <text x="728" y="500"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    text-anchor="middle"
    fill="#6B7A99">Банковская карта,</text>
  <text x="728" y="524"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    text-anchor="middle"
    fill="#6B7A99">перевод на счёт</text>

  <!-- Step 4 -->
  <circle cx="982" cy="332" r="52" fill="#FF6B35" filter="url(#stepShadow)"/>
  <text x="982" y="345"
    font-family="Arial Black, Arial, sans-serif"
    font-size="40"
    font-weight="900"
    text-anchor="middle"
    fill="#FFFFFF">4</text>

  <text x="982" y="430"
    font-family="Arial Black, Arial, sans-serif"
    font-size="22"
    font-weight="900"
    text-anchor="middle"
    fill="#1A1A2E">Получаете</text>
  <text x="982" y="458"
    font-family="Arial Black, Arial, sans-serif"
    font-size="22"
    font-weight="900"
    text-anchor="middle"
    fill="#1A1A2E">решение</text>
  <text x="982" y="500"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    text-anchor="middle"
    fill="#6B7A99">Файлы и пояснения</text>
  <text x="982" y="524"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    text-anchor="middle"
    fill="#6B7A99">прямо в Telegram</text>

  <!-- Bottom guarantee block -->
  <rect x="60" y="600" width="1080" height="140" rx="20" fill="#1B3A6B"/>

  <text x="190" y="660"
    font-family="Arial, Helvetica, sans-serif"
    font-size="32">🛡️</text>

  <text x="240" y="655"
    font-family="Arial Black, Arial, sans-serif"
    font-size="28"
    font-weight="900"
    fill="#FFFFFF">Не устраивает результат?</text>

  <text x="240" y="695"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    fill="#B8CCE8">Откройте спор — разберёмся. Никакого риска для вас.</text>

  <text x="240" y="728"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    fill="#FF6B35">Поддержка: @studario_support</text>

  <text x="1140" y="775"
    font-family="Arial Black, Arial, sans-serif"
    font-size="22"
    font-weight="900"
    text-anchor="end"
    fill="#FFFFFF"
    opacity="0.5">Studario</text>
</svg>
