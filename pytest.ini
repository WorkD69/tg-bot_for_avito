[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = module
testpaths = tests
filterwarnings =
    # AsyncMock coroutines in the deferred list are never awaited — this is intentional:
    # tests pass deferred=[] to AuctionService but don't drain it (DB assertions only).
    ignore:coroutine.*was never awaited:RuntimeWarning
